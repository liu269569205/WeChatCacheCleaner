# Disable Gradle's file system watching. On Windows the VFS watcher keeps a
# handle open on the build output directory, which makes the `clean` task block
# forever. Turning the watcher off fixes recursive directory deletes.
org.gradle.vfs.watch=false
# Keep daemon memory sane for this small project.
org.gradle.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8
